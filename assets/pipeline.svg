<svg viewBox="0 0 940 250" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pipeline: Gmail to LLM script to text-to-speech to S3 storage to podcast feed to phone">
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="938" height="248" rx="22" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>

  <!-- connecting line -->
  <line x1="90" y1="108" x2="850" y2="108" stroke="#1e293b" stroke-width="3"/>
  <path d="M90,108 L850,108" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="8 14" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <circle r="7" fill="#67e8f9" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M90,108 L850,108"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.96;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 1. Gmail -->
  <g transform="translate(90,108)">
    <circle r="34" fill="#ea4335" stroke="#0b1220" stroke-width="4"/>
    <g stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round">
      <rect x="-16" y="-11" width="32" height="22" rx="2"/>
      <path d="M-16,-11 L0,3 L16,-11"/>
    </g>
    <text x="0" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">Gmail</text>
    <text x="0" y="78" text-anchor="middle" font-size="11.5" fill="#94a3b8">IMAP inbox</text>
  </g>

  <!-- 2. Script (Gemini) -->
  <g transform="translate(242,108)">
    <circle r="34" fill="#6366f1" stroke="#0b1220" stroke-width="4"/>
    <path d="M0,-15 L4.5,-4.5 L15,0 L4.5,4.5 L0,15 L-4.5,4.5 L-15,0 L-4.5,-4.5 Z" fill="#fff"/>
    <text x="0" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">Script</text>
    <text x="0" y="78" text-anchor="middle" font-size="11.5" fill="#94a3b8">Gemini, free</text>
  </g>

  <!-- 3. TTS (Edge voice) -->
  <g transform="translate(394,108)">
    <circle r="34" fill="#10b981" stroke="#0b1220" stroke-width="4"/>
    <g fill="#fff">
      <rect x="-13" y="-4" width="6" height="8" rx="2">
        <animate attributeName="y" values="-4;-10;-4" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="height" values="8;20;8" dur="0.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="-3" y="-9" width="6" height="18" rx="2">
        <animate attributeName="y" values="-9;-3;-9" dur="0.55s" repeatCount="indefinite"/>
        <animate attributeName="height" values="18;6;18" dur="0.55s" repeatCount="indefinite"/>
      </rect>
      <rect x="7" y="-6" width="6" height="12" rx="2">
        <animate attributeName="y" values="-6;-12;-6" dur="0.85s" repeatCount="indefinite"/>
        <animate attributeName="height" values="12;24;12" dur="0.85s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="0" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">Voice</text>
    <text x="0" y="78" text-anchor="middle" font-size="11.5" fill="#94a3b8">Edge TTS, free</text>
  </g>

  <!-- 4. Storage (S3) -->
  <g transform="translate(546,108)">
    <circle r="34" fill="#f59e0b" stroke="#0b1220" stroke-width="4"/>
    <g stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round">
      <ellipse cx="0" cy="-9" rx="14" ry="5"/>
      <path d="M-14,-9 L-14,9 A14,5 0 0 0 14,9 L14,-9"/>
    </g>
    <text x="0" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">Storage</text>
    <text x="0" y="78" text-anchor="middle" font-size="11.5" fill="#94a3b8">S3 bucket</text>
  </g>

  <!-- 5. Feed -->
  <g transform="translate(698,108)">
    <circle r="34" fill="#ec4899" stroke="#0b1220" stroke-width="4"/>
    <g stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M-12,-2 A12,12 0 0 1 0,10"/>
      <path d="M-12,-14 A26,26 0 0 1 12,10"/>
    </g>
    <circle cx="-12" cy="10" r="3" fill="#fff"/>
    <text x="0" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">Feed</text>
    <text x="0" y="78" text-anchor="middle" font-size="11.5" fill="#94a3b8">feed.xml</text>
  </g>

  <!-- 6. Podcasts app -->
  <g transform="translate(850,108)">
    <circle r="34" fill="#38bdf8" stroke="#0b1220" stroke-width="4"/>
    <g stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round">
      <rect x="-10" y="-16" width="20" height="32" rx="4"/>
    </g>
    <circle cx="0" cy="11" r="1.4" fill="#fff"/>
    <path d="M-4,-8 L-4,8 L8,0 Z" fill="#fff"/>
    <text x="0" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">Podcasts</text>
    <text x="0" y="78" text-anchor="middle" font-size="11.5" fill="#94a3b8">iPhone app</text>
  </g>
</svg>
