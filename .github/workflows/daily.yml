name: Newsletter podcasts

on:
  schedule:
    # Every 30 minutes across the windows when newsletters arrive: Morning Brew
    # and MarketWatch in the morning, WSJ Markets P.M. after the close. A run
    # that finds nothing new takes seconds, and a late email (forwarding lag)
    # is picked up by the next run. Off-peak minutes avoid GitHub's cron queue.
    - cron: "17,47 9-14 * * *"
    - cron: "17,47 20-23 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Which newsletter"
        type: choice
        options: [all, brew, marketwatch, wsj]
        default: all
      force:
        description: "Regenerate the newest episode even if it exists"
        type: boolean
        default: false

# Two runs must never publish at once (a manual run overlapping a scheduled one).
concurrency:
  group: newsletter-podcasts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python brew.py --source ${{ inputs.source || 'all' }} ${{ inputs.force && '--force' || '' }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
